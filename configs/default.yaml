seed: 0

# ── Data ──
train_size: 7000
val_size: 1000
test_size: 2000
batch_size: 512
test_batch_sizes: [256, 512]

# ── Training ──
eval_step: 10

# ── Model ──
network: MLP           # MLP | ContextMLPv1 | ContextMLPv2 | LocalContextMLPv1 | LocalContextMLPv2 | MoE
hidden_dim: 1024
num_layers: 4
dropout: 0.1
ContextMLPv1:
  num_context_points: 16
  normalize: true
  fit_batch_size: 256
  eps: 1.0e-8
ContextMLPv2:
  num_context_points: 4
  normalize: true
  fit_batch_size: 256
  eps: 1.0e-8
  context_encoder_dim: 128
LocalContextMLPv2:
  local_delta_scale: 0.2
  coarse_loss_weight: 0.5
# MoE-specific (only used when network: MoE)
MoE:
  num_experts: 4         # number of expert MLPs
  top_k: 2               # experts activated per token; 0 -> dense soft routing
  aux_loss_weight: 0.01  # weight for load-balancing auxiliary loss
  gate_temperature: 1.0
  gate_noise_std: 0.0
  warmup_epochs: 30
  start_temp: 2.0
  final_temp: 1.0
  gate_noise_final: 0.0
  temp_decay_epochs: 200
moe_strategy: vanilla    # vanilla | top2_best_merit
moe_candidate_top_k: 2   # used by top2_best_merit-style inference

# ── Shared defaults (merged into every method) ──
# Per-method sections below only need to list overrides.
defaults:
  lr: 0.0001
  num_epochs: 300
  obj_weight: 1.0
  eq_pen_weight: 10.0
  ineq_pen_weight: 10.0
  dist_weight: 5.0
  scale: 1000
  # L-BFGS / feasibility seeking
  val_tol: 1.0e-7
  test_val_tol: 1.0e-9
  decay_tol_step: 100
  memory_size: 30      # convex: 10, nonconvex: 20-30
  max_iter: 50
  max_diff_iter: 30

# ── Per-method overrides ──
penalty:  
  lr: 0.0001
  num_epochs: 1000
  obj_weight: 1.0
  eq_pen_weight: 100.0
  ineq_pen_weight: 50.0

adaptive_penalty:
  eq_pen_weight_max: 500.0
  ineq_pen_weight_max: 100.0
  increasing_rate: 2.0
  num_epochs: 1000

FSNet: {}

S3Net:
  scale: 500

DC3:
  corr_lr: 1.0e-6
  max_corr_steps: 30
  corr_momentum: 0.5
  lr: 0.00005
  num_epochs: 1000

sup:
  lr: 0.0005
  num_epochs: 1000

sup_partial:
  lr: 0.0005
  num_epochs: 1000

sup_pen:
  obj_weight: 0.1
  num_epochs: 1000

semi: {}
