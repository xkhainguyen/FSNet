seed: 2025

# ── Data ──
train_size: 7000
val_size: 1000
test_size: 2000
batch_size: 512
test_batch_sizes: [256, 512]

# ── Training ──
eval_step: 10

# ── Model ──
hidden_dim: 1024
num_layers: 4
dropout: 0.1

# ── Shared defaults (merged into every method) ──
# Per-method sections below only need to list overrides.
defaults:
  lr: 0.0001
  num_epochs: 300
  obj_weight: 1.0
  eq_pen_weight: 10.0
  ineq_pen_weight: 10.0
  dist_weight: 5.0
  scale: 1000
  # L-BFGS / feasibility seeking
  val_tol: 1.0e-7
  test_val_tol: 1.0e-9
  decay_tol_step: 100
  memory_size: 30      # convex: 10, nonconvex: 20-30
  max_iter: 50
  max_diff_iter: 30

# ── Per-method overrides ──
penalty:
  num_epochs: 1000

adaptive_penalty:
  eq_pen_weight_max: 500.0
  ineq_pen_weight_max: 100.0
  increasing_rate: 2.0
  num_epochs: 1000

FSNet: {}

S3Net:
  scale: 500

DC3:
  corr_lr: 1.0e-6
  max_corr_steps: 30
  corr_momentum: 0.5
  lr: 0.00005
  num_epochs: 1000

sup:
  lr: 0.0005
  num_epochs: 1000

sup_partial:
  lr: 0.0005
  num_epochs: 1000

sup_pen:
  obj_weight: 0.1
  num_epochs: 1000

semi: {}
